---
- name: Install packages similar to home.packages
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # Mirrors the cross-platform packages from home.nix where possible.
    common_packages:
      - ripgrep
      - jq
      - curl
      - htop
      - podman
      - nodejs
      - gh
      - direnv


  tasks:
    # - name: Install common system packages
    #   ansible.builtin.package:
    #     name: "{{ common_packages }}"
    #     state: present

    # NOTE: pi and herdr are now installed via Nix
    # (github:numtide/llm-agents.nix in home.nix) — not via npm/curl/brew.

    - name: Check if typescript is already installed globally
      ansible.builtin.command: npm list -g --depth=0 typescript
      register: typescript_check
      changed_when: false
      failed_when: false
      become: false
      environment:
        NPM_CONFIG_PREFIX: "{{ lookup('env', 'HOME') }}/.local"

    - name: Install typescript globally via npm
      ansible.builtin.command: npm install -g typescript
      when: typescript_check.rc != 0
      become: false
      environment:
        NPM_CONFIG_PREFIX: "{{ lookup('env', 'HOME') }}/.local"

