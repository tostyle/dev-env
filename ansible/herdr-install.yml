---
- name: Install herdr agent runtime
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Check if herdr is already installed
      ansible.builtin.command: which herdr
      register: herdr_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install herdr via Homebrew (macOS)
      community.general.homebrew:
        name: herdr
        state: present
      when:
        - herdr_check.rc != 0
        - ansible_os_family == "Darwin"

    - name: Install herdr via curl (Linux)
      ansible.builtin.shell: |
        curl -fsSL https://herdr.dev/install.sh | sh
      when:
        - herdr_check.rc != 0
        - ansible_os_family != "Darwin"
      become: false
